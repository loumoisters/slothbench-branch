name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history, for the secret scan
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No dependencies - nothing to install.
      # No API keys, tokens or private keys in any commit.
      - run: node scripts/scan-secrets.js --history
      - run: npm test
